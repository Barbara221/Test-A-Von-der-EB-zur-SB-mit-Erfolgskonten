<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Die Bilanzreise</title><style>
:root{font-family:system-ui,-apple-system,Arial;color:#15243c;background:#eef3f8}*{box-sizing:border-box}body{margin:0}header{background:#102b49;color:white;padding:22px max(18px,calc((100vw - 1050px)/2))}h1{margin:0;font-size:clamp(25px,4vw,37px)}h2{margin-top:0}main{max-width:1050px;margin:25px auto;padding:0 15px 40px}.panel{background:white;border-radius:15px;padding:22px;margin:16px 0;box-shadow:0 3px 18px #16345412}.muted{color:#59697c}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.line{display:flex;gap:8px;margin:6px 0;align-items:center}.line>*{min-width:0}input,select{border:1px solid #b9c8d6;border-radius:7px;padding:10px;font:inherit;width:100%;background:white}input[type=number]{max-width:145px}button{background:#126b85;border:0;color:white;padding:12px 17px;border-radius:9px;font-weight:650;cursor:pointer;margin:5px 5px 5px 0}button.secondary{background:#dfeaf2;color:#153450}button:disabled{opacity:.5}.pill{display:inline-block;background:#dfeef3;border-radius:30px;padding:7px 12px;margin:4px}.tbl{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #e0e6ed;padding:9px;text-align:left}th{background:#edf3f8}.box{border:1px solid #d7e3eb;padding:12px;border-radius:9px}.error{border-left:4px solid #d56855;padding:10px;background:#fff5f2;margin:7px 0}.good{color:#147250}.result{font-size:28px;font-weight:750}.hidden{display:none}.tk{border:1px solid #b9c8d6;border-radius:10px;padding:12px;margin:10px 0}.tkgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tkgrid>div{border-top:2px solid #234}.tiny{font-size:13px}.scroll{overflow:auto}@media(max-width:700px){.grid,.three{grid-template-columns:1fr}.line{flex-wrap:wrap}.line select{flex:1 1 180px}.panel{padding:15px}}@media print{header,.noprint,button{display:none!important}main{margin:0;max-width:none}.panel{box-shadow:none;break-inside:avoid}body{background:white}}
</style></head><body><header><h1>🧭 Die Bilanzreise</h1><div>Von der Eröffnungsbilanz zur Schlussbilanz · 4. Klasse Hotelfachschule</div></header><main><div id="app"></div></main><script>
const D={"A": {"Betriebs- und Geschäftsausstattung": 42000, "Warenbestand": 8500, "Forderungen aus Lieferungen und Leistungen": 6300, "Bank": 11200, "Kassa": 2000}, "P": {"Eigenkapital": 39000, "Darlehen": 24000, "Verbindlichkeiten aus Lieferungen und Leistungen": 7000}, "transactions": [["Waren werden auf Ziel eingekauft", "Wareneinkauf", "Verbindlichkeiten aus Lieferungen und Leistungen", 1800], ["Ein Gast begleicht eine offene Forderung per Banküberweisung", "Bank", "Forderungen aus Lieferungen und Leistungen", 2300], ["Für die Nutzung der gemieteten Räumlichkeiten müssen wir die Monatsmiete in Höhe von 1.200 € bezahlen. Die Rechnung liegt vor, die Zahlung ist noch nicht erfolgt.", "Mietaufwand", "Verbindlichkeiten aus Lieferungen und Leistungen", 1200], ["Zinsen werden dem Bankkonto gutgeschrieben", "Bank", "Zinserträge", 150], ["Ein Teil des Darlehens wird per Banküberweisung getilgt", "Darlehen", "Bank", 3000]], "accounts": {"Betriebs- und Geschäftsausstattung": [42000, 0], "Warenbestand": [8500, 0], "Forderungen aus Lieferungen und Leistungen": [6300, 2300], "Bank": [13650, 3000], "Kassa": [2000, 0], "Eigenkapital": [0, 39000], "Darlehen": [3000, 24000], "Verbindlichkeiten aus Lieferungen und Leistungen": [0, 10000], "Wareneinkauf": [1800, 0], "Mietaufwand": [1200, 0], "Zinserträge": [0, 150]}, "balances": {"Betriebs- und Geschäftsausstattung": 42000, "Warenbestand": 8500, "Forderungen aus Lieferungen und Leistungen": 4000, "Bank": 10650, "Kassa": 2000, "Darlehen": 21000, "Verbindlichkeiten aus Lieferungen und Leistungen": 10000, "Wareneinkauf": 1800, "Mietaufwand": 1200, "Zinserträge": 150}, "endA": {"Betriebs- und Geschäftsausstattung": 42000, "Warenbestand": 8500, "Forderungen aus Lieferungen und Leistungen": 4000, "Bank": 10650, "Kassa": 2000}, "endP": {"Eigenkapital": 36150, "Darlehen": 21000, "Verbindlichkeiten aus Lieferungen und Leistungen": 10000}, "profit": -2850, "ek": 39000}, MAX=50, WEIGHTS=[9,7,10,8,7,6,3], NAMES=['Eröffnungsbilanz','Eröffnungsbuchungen','Journal','Hauptbuch und Kontenabschluss','Gewinn- und Verlustkonto','Schlussbilanz','Kennzahlen'];
const all=Object.keys(D.accounts), assets=Object.keys(D.A), debts=Object.keys(D.P), expense=['Wareneinkauf','Mietaufwand','Zinsaufwand'], revenue=['Umsatzerlöse','Zinserträge'], operational=all.filter(k=>k!=='Eigenkapital');let stage=-1,person={},records=[],helpUsed={},locked=false;
const $=id=>document.getElementById(id),money=x=>Number(x).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' €',num=v=>v===''||v==null?null:Number(String(v).replace(',','.')),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function select(opts,cl='account'){return `<select class="${cl}"><option value="">– Konto wählen –</option>${opts.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select>`}function inp(cl='amount'){return `<input class="${cl}" type="number" step="0.01" placeholder="Betrag">`}
function row(opts=all){return `<div class="line">${select(opts)}${inp()}</div>`}function rows(n,opts=all){return Array.from({length:n},()=>row(opts)).join('')}
function balance(A,P){return `<div class="grid"><div class="box"><h3>Aktiva</h3><table class="tbl">${Object.entries(A).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${money(v)}</td></tr>`).join('')}<tr><th>Summe</th><th>${money(Object.values(A).reduce((a,b)=>a+b,0))}</th></tr></table></div><div class="box"><h3>Passiva</h3><table class="tbl">${Object.entries(P).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${money(v)}</td></tr>`).join('')}<tr><th>Summe</th><th>${money(Object.values(P).reduce((a,b)=>a+b,0))}</th></tr></table></div></div>`}
function entryBox(label){return `<div class="box"><h3>${label}</h3>${rows(9)}<div class="line">Bilanzsumme ${inp('sum')}</div></div>`}
function linesRead(el){if(!el)return [];return [...el.querySelectorAll('.line')].filter(x=>x.querySelector('select')).map(x=>({k:x.querySelector('select')?.value||'',v:num(x.querySelector('input')?.value??'')}))}function nread(el,cls){return num(el?.querySelector('.'+cls)?.value??'')}
function start(){ $('app').innerHTML=`<section class="panel"><h2>Willkommen zur Bilanzreise</h2><p>Sie bearbeiten sieben Stationen. Nach jeder verbindlichen Abgabe wird die nächste Station freigeschaltet. Ihre Antworten können danach nicht mehr verändert werden. Lösungen und Fehleranalyse erhalten Sie erst am Ende.</p><div class="three"><label>Vorname<input id="first" autocomplete="given-name"></label><label>Nachname<input id="last" autocomplete="family-name"></label><label>Klasse<input id="class" value="4."></label></div><p>Maximal 50 Punkte · Denkhilfen kosten 1, 2 oder 3 Punkte.</p><button onclick="begin()">Reise starten</button></section>`}
function begin(){person={first:$('first').value.trim(),last:$('last').value.trim(),class:$('class').value.trim()};if(!person.first||!person.last||!person.class){alert('Bitte geben Sie Vorname, Nachname und Klasse ein.');return}stage=0;render()}
function unordered(o){return Object.entries(o).sort((a,b)=>a[0].localeCompare(b[0])).reverse().map(([k,v])=>`<span class="pill">${esc(k)}: ${money(v)}</span>`).join('')}
const hints=[['Ordnen Sie zuerst Bestandskonten nach ihrer Bilanzseite.','Ermitteln Sie das Eigenkapital als Differenz zwischen Vermögen und Schulden.','Prüfen Sie die Reihenfolge nach Liquidierbarkeit beziehungsweise Fälligkeit.'],['Denken Sie an die Gegenbuchung über das EBK.','Aktivkonten werden im Soll, Passivkonten im Haben eröffnet.','Der EBK-Abschluss bildet die Spiegelung der Eröffnungsbilanz.'],['Prüfen Sie, welche Kontenart zunimmt oder abnimmt.','Aufwendungen stehen grundsätzlich im Soll, Erträge im Haben.','Eine Darlehenstilgung vermindert die Schuld und das Bankguthaben.'],['Ermitteln Sie je Konto Soll- und Habensumme.','Der Saldo steht zum Ausgleich auf der betragsmäßig kleineren Seite.','Erfolgskonten werden über GuV, Bestandskonten über SBK abgeschlossen.'],['Trennen Sie Aufwendungen und Erträge.','Die Differenz aus Erträgen und Aufwendungen ist das Jahresergebnis.','Ein Verlust vermindert das Eigenkapital und wird auf dessen Sollseite gebucht.'],['Nutzen Sie ausschließlich die angegebenen Endbestände.','Eigenkapital gehört auf die Passivseite; die Summe muss übereinstimmen.','Ordnen Sie zuerst Anlage- und Umlaufvermögen sowie Eigen- und Fremdkapital.'],['Verwenden Sie die Werte aus Schlussbilanz und GuV.','Eigenkapitalquote = Eigenkapital / Gesamtkapital × 100.','Anlagedeckungsgrad II = (Eigenkapital + langfristiges Fremdkapital) / Anlagevermögen × 100.']];
function render(){let s='';if(stage===0){let items={...D.A,...Object.fromEntries(Object.entries(D.P).filter(([k])=>k!=='Eigenkapital'))};s=`<p>Folgende ungeordnete Bilanzposten liegen vor. Erstellen Sie daraus die Eröffnungsbilanz. Ermitteln Sie das Eigenkapital selbst.</p><div>${unordered(items)}</div><div class="grid">${entryBox('Aktiva')}${entryBox('Passiva')}</div>`}
if(stage===1){s=`<p>Erstellen Sie die Eröffnungsbuchungen als zusammengesetzten Buchungssatz über das EBK. Wählen Sie Soll- und Habenkonten und tragen Sie die Beträge ein.</p>${balance(D.A,D.P)}<div class="grid"><div class="box"><h3>Soll</h3>${rows(9,[...all,'Eröffnungsbilanzkonto (EBK)'])}</div><div class="box"><h3>Haben</h3>${rows(9,[...all,'Eröffnungsbilanzkonto (EBK)'])}</div></div>`}
if(stage===2){s=`<p>Verbuchen Sie die folgenden Geschäftsfälle im Journal.</p>${D.transactions.map((t,i)=>`<div class="box journal-case" style="margin:10px 0"><b>Geschäftsfall ${i+1}</b><p>${esc(t[0])}, ${money(t[3])}.</p><div class="three"><label>Sollkonto${select(all,'debit')}</label><label>Habenkonto${select(all,'credit')}</label><label>Betrag${inp('value')}</label></div></div>`).join('')}`}
if(stage===3){let keys=Object.keys(D.accounts).filter(k=>k!=='Eigenkapital').sort((a,b)=>b.localeCompare(a));s=`<p>Die Buchungen sind bereits eingetragen. Ermitteln Sie je Konto den Saldo, die Abschlussseite und das Abschlusskonto. Das Eigenkapital wird erst in Station 5 behandelt.</p>${keys.map(k=>{let [a,b]=D.accounts[k];return `<div class="tk" data-key="${esc(k)}"><b>${esc(k)}</b><div class="tkgrid"><div><b>Soll</b><p>${a?money(a):'–'}</p></div><div><b>Haben</b><p>${b?money(b):'–'}</p></div></div><div class="three"><label>Saldo${inp('saldo')}</label><label>Abschlussseite<select class="side"><option value="">– auswählen –</option><option>Soll</option><option>Haben</option></select></label><label>Abschluss über<select class="close"><option value="">– auswählen –</option><option>GuV</option><option>SBK</option></select></label></div></div>`}).join('')}`}
if(stage===4){let sums={'Wareneinkauf':1800,'Mietaufwand':1200,'Zinserträge':150};s=`<p>Ordnen Sie die Salden der Erfolgskonten dem GuV-Konto zu. Berechnen Sie die Summen und das Ergebnis und buchen Sie dieses auf das Eigenkapitalkonto.</p><div>${unordered(sums)}</div><div class="grid"><div class="box"><h3>GuV Soll</h3>${rows(5,all)}</div><div class="box"><h3>GuV Haben</h3>${rows(5,all)}</div></div><div class="three"><label>Summe Aufwendungen${inp('exp')}</label><label>Summe Erträge${inp('rev')}</label><label>Jahresergebnis (Verlust negativ)${inp('profit')}</label></div><h3>Ergebnisbuchung</h3><div class="three"><label>Soll${select([...all,'GuV'],'transferdebit')}</label><label>Haben${select([...all,'GuV'],'transfercredit')}</label><label>Betrag${inp('transfervalue')}</label></div>`}
if(stage===5){s=`<p>Erstellen Sie aus diesen ungeordneten Salden die Schlussbilanz. Ermitteln Sie die Bilanzsummen selbst.</p><div>${unordered({...D.endA,...D.endP})}</div><div class="grid">${entryBox('Aktiva')}${entryBox('Passiva')}</div>`}
if(stage===6){s=`<p>Berechnen Sie die drei Kennzahlen. Geben Sie die Ergebnisse in Prozent an und beurteilen Sie sie. Für die Eigenkapitalrentabilität verwenden Sie das Jahresergebnis vor Steuern. Beurteilen Sie jede Kennzahl anhand Ihres Fachwissens und begründen Sie Ihre Einschätzung gedanklich.</p>${balance(D.endA,D.endP)}<div class="box"><b>GuV</b><p>Aufwendungen: ${money(3000)} · Erträge: ${money(150)} · Jahresergebnis: ${money(D.profit)}</p></div>${['Eigenkapitalquote','Anlagedeckungsgrad II','Eigenkapitalrentabilität'].map((k,i)=>`<div class="box" style="margin:10px 0"><b>${k}</b><div class="three"><label>Ergebnis in %${inp('ratio'+i)}</label><label>Beurteilung<select class="judgement"><option value="">– auswählen –</option><option value="gut">gut</option><option value="schlecht">schlecht</option></select></label></div></div>`).join('')}`}
$('app').innerHTML=`<div class="noprint"><span class="pill">${esc(person.first)} ${esc(person.last)} · ${esc(person.class)}</span><span class="pill">Station ${stage+1} von 7</span><span class="pill">${WEIGHTS[stage]} mögliche Punkte</span></div><section class="panel" id="work"><h2>Station ${stage+1} – ${NAMES[stage]}</h2>${s}</section><section class="panel noprint"><h3>Denkhilfen (freiwillig)</h3><div id="hints"></div>${[0,1,2].map(i=>`<button class="secondary" onclick="hint(${i})" id="h${i}">Denkhilfe ${i+1} (−${i+1} P.)</button>`).join('')}<hr><button onclick="submitStation()">Station verbindlich abgeben</button><p class="muted tiny">Eine leere Abgabe ist möglich. Vor der Abgabe erfolgt eine Sicherheitsabfrage.</p></section>`;updateHints()}
function hint(i){helpUsed[stage]??=[];if(helpUsed[stage].includes(i))return;if(!confirm(`Denkhilfe ${i+1} verwenden? Dafür werden ${i+1} Punkte abgezogen.`))return;helpUsed[stage].push(i);updateHints()}
function updateHints(){if(!$('hints'))return;$('hints').innerHTML=(helpUsed[stage]||[]).map(i=>`<p class="box">${esc(hints[stage][i])}</p>`).join('');for(let i=0;i<3;i++)$('h'+i).disabled=(helpUsed[stage]||[]).includes(i)}
function collect(){let w=$('work');if(stage===0||stage===5){let b=w.querySelectorAll('.box');return {a:linesRead(b[0]),p:linesRead(b[1]),as:nread(b[0],'sum'),ps:nread(b[1],'sum')}}if(stage===1){let b=w.querySelectorAll('.box');return {a:linesRead(b[b.length-2]),p:linesRead(b[b.length-1])}}if(stage===2)return [...w.querySelectorAll('.journal-case')].map(b=>({s:b.querySelector('select.debit')?.value||'',h:b.querySelector('select.credit')?.value||'',v:num(b.querySelector('input.value')?.value??'')}));if(stage===3)return [...w.querySelectorAll('.tk')].map(b=>({k:b.dataset.key,v:nread(b,'saldo'),side:b.querySelector('.side')?.value||'',close:b.querySelector('.close')?.value||''}));if(stage===4){let b=w.querySelectorAll('.box');return {a:linesRead(b[0]),p:linesRead(b[1]),exp:nread(w,'exp'),rev:nread(w,'rev'),profit:nread(w,'profit'),td:w.querySelector('.transferdebit')?.value||'',tc:w.querySelector('.transfercredit')?.value||'',tv:nread(w,'transfervalue')}}if(stage===6)return [...w.querySelectorAll('.judgement')].map((sel,i)=>({v:nread(sel.closest('.box'),'ratio'+i),j:sel.value||''}))}
function eq(a,b){return a!==null&&a!==''&&Math.abs(Number(a)-Number(b))<.011}function mark(ok,points,label,got,want,issues){if(!ok)issues.push({label,got:String(got??'leer'),want:String(want),lost:points});return ok?points:0}
function gradeRows(got,expected,points,issues,prefix){let score=0,each=points/expected.length;let used=new Set();for(let i=0;i<expected.length;i++){let [k,v]=expected[i];let idx=got.findIndex((x,j)=>!used.has(j)&&x.k===k);if(idx>=0)used.add(idx);let g=idx>=0?got[idx]:null;let name=prefix+' – '+k;score+=mark(!!g,each*.55,name+' (Konto)',g?.k||'leer',k,issues);if(g){score+=mark(eq(g.v,v),each*.3,name+' (Betrag)',g.v,v,issues);score+=mark(idx===i,each*.15,name+' (Reihenfolge)',idx+1,i+1,issues)}else{mark(false,each*.3,name+' (Betrag)','leer',v,issues);mark(false,each*.15,name+' (Reihenfolge)','leer',i+1,issues)}}for(let i=0;i<got.length;i++)if(got[i].k&&!used.has(i))issues.push({label:prefix+' – zusätzliche/falsche Eingabe',got:got[i].k+' '+got[i].v,want:'Keine zusätzliche Position',lost:0});return score}
function scoreStation(st,x){let issues=[],score=0,W=WEIGHTS[st];if(st===0||st===5){let A=st===0?D.A:D.endA,P=st===0?D.P:D.endP;score+=gradeRows(x.a,Object.entries(A),W*.45,issues,'Aktiva');score+=gradeRows(x.p,Object.entries(P),W*.45,issues,'Passiva');let total=Object.values(A).reduce((a,b)=>a+b,0);score+=mark(eq(x.as,total),W*.05,'Aktivsumme',x.as,total,issues);score+=mark(eq(x.ps,total),W*.05,'Passivsumme',x.ps,total,issues)}
if(st===1){let expA=[...Object.entries(D.A).map(([k,v])=>[k,v]),['Eröffnungsbilanzkonto (EBK)',Object.values(D.P).reduce((a,b)=>a+b,0)]],expP=[['Eröffnungsbilanzkonto (EBK)',Object.values(D.A).reduce((a,b)=>a+b,0)],...Object.entries(D.P).map(([k,v])=>[k,v])];for(let [rows,exp,side] of [[x.a,expA,'Soll'],[x.p,expP,'Haben']]){for(let [k,v] of exp){let g=rows.find(r=>r.k===k);let p=W/(expA.length+expP.length);score+=mark(!!g,p*.7,side+'konto '+k,g?.k,'Konto '+k+' im '+side,issues);score+=mark(!!g&&eq(g.v,v),p*.3,side+'betrag '+k,g?.v,v,issues)}}}
if(st===2){x.forEach((g,i)=>{let t=D.transactions[i];if(!t)return;let p=W/D.transactions.length;score+=mark(g.s===t[1],p*.4,'Fall '+(i+1)+' Sollkonto',g.s,t[1],issues);score+=mark(g.h===t[2],p*.4,'Fall '+(i+1)+' Habenkonto',g.h,t[2],issues);score+=mark(eq(g.v,t[3])&&g.s===t[1]&&g.h===t[2],p*.2,'Fall '+(i+1)+' Betrag und vollständige Buchung',g.v,t[3],issues)})}
if(st===3){x.forEach(g=>{let [a,b]=D.accounts[g.k]||[0,0],v=Math.abs(a-b),side=a>b?'Haben':'Soll',close=expense.includes(g.k)||revenue.includes(g.k)?'GuV':'SBK',p=W/x.length;score+=mark(eq(g.v,v),p*.4,g.k+' Saldo',g.v,v,issues);score+=mark(g.side===side,p*.3,g.k+' Abschlussseite',g.side,side,issues);score+=mark(g.close===close,p*.3,g.k+' Abschlusskonto',g.close,close,issues)})}
if(st===4){score+=gradeRows(x.a,[['Wareneinkauf',1800],['Mietaufwand',1200]],W*.25,issues,'GuV Soll');score+=gradeRows(x.p,[['Zinserträge',150]],W*.15,issues,'GuV Haben');for(let [key,v,p] of [['exp',3000,.1],['rev',150,.1],['profit',D.profit,.15],['tv',Math.abs(D.profit),.05]])score+=mark(eq(x[key],v),W*p,key,x[key],v,issues);score+=mark(x.td==='Eigenkapital',W*.1,'Ergebnisbuchung Soll',x.td,'Eigenkapital',issues);score+=mark(x.tc==='GuV',W*.1,'Ergebnisbuchung Haben',x.tc,'GuV',issues)}
if(st===6){let total=Object.values(D.endA).reduce((a,b)=>a+b,0),expected=[D.endP.Eigenkapital/total*100,(D.endP.Eigenkapital+D.endP.Darlehen)/D.endA['Betriebs- und Geschäftsausstattung']*100,D.profit/D.endP.Eigenkapital*100];x.forEach((g,i)=>{score+=mark(g.v!==null&&Math.abs(g.v-expected[i])<=.11,W/3*.7,NAMES[st]+' '+['Eigenkapitalquote','Anlagedeckungsgrad II','Eigenkapitalrentabilität'][i],g.v,expected[i].toFixed(2)+' %',issues);score+=mark(g.j===(expected[i]>=([30,100,0][i])&&(i!==2||expected[i]>0)?'gut':'schlecht'),W/3*.3,'Beurteilung '+(i+1),g.j,expected[i]>=([30,100,0][i])&&(i!==2||expected[i]>0)?'gut':'schlecht',issues)})}
return {score:Math.min(W,score),issues}}
function submitStation(){
 if(document.getElementById('submit-confirm'))return;
 const panel=document.createElement('div');panel.id='submit-confirm';panel.className='panel';panel.style.cssText='border:2px solid #126b85;background:#f2fbff;margin-top:14px';
 panel.innerHTML='<strong>Station verbindlich abgeben?</strong><p>Danach können Sie Ihre Antworten nicht mehr verändern. Auch eine vollständig leere Station darf abgegeben werden.</p><button type="button" id="submit-yes">Ja, verbindlich abgeben</button><button type="button" class="secondary" id="submit-no">Zurück zur Bearbeitung</button><p id="submit-error" role="alert" style="color:#a22"></p>';
 document.querySelector('#work').nextElementSibling.appendChild(panel); panel.scrollIntoView({behavior:'smooth',block:'nearest'});
 document.getElementById('submit-no').onclick=()=>panel.remove();
 document.getElementById('submit-yes').onclick=()=>{try{
   const answers=collect(),result=scoreStation(stage,answers);
   records.push({stage,answers,...result,hints:helpUsed[stage]||[]});stage++;
   if(stage===7)results();else render();window.scrollTo(0,0);
 }catch(e){document.getElementById('submit-error').textContent='Technischer Fehler: '+e.message;console.error(e)}};
}
function results(){let raw=records.reduce((a,r)=>a+r.score,0),penalty=records.reduce((a,r)=>a+r.hints.reduce((s,i)=>s+i+1,0),0),final=Math.max(0,raw-penalty),pct=final/MAX*100;let bounds=[[40,10],[39,9.5],[38,9],[36,8.5],[34,8],[32,7.5],[30,7],[28,6.5],[26,6],[24,5.5],[22,5],[20,4.5],[18,4]];let scaled=final*40/MAX,grade=bounds.find(([n])=>scaled+1e-8>=n)?.[1]??'unter 4';$('app').innerHTML=`<section class="panel"><h2>Ihre persönliche Ergebnisübersicht</h2><p><b>${esc(person.first)} ${esc(person.last)}</b> · Klasse ${esc(person.class)}</p><div class="result">Note: ${grade}</div><p>Gesamtpunkte vor Abzügen: <b>${raw.toFixed(2)} / ${MAX}</b><br>Denkhilfen-Abzug: <b>−${penalty}</b><br>Endgültige Punkte: <b>${final.toFixed(2)} / ${MAX}</b><br>Ergebnis: <b>${pct.toFixed(1)} %</b> · ${pct>=65?'positiv':'negativ'}</p><table class="tbl"><tr><th>Station</th><th>Punkte</th><th>Maximal</th></tr>${records.map(r=>`<tr><td>${NAMES[r.stage]}</td><td>${r.score.toFixed(2)}</td><td>${WEIGHTS[r.stage]}</td></tr>`).join('')}</table><div class="noprint"><button onclick="window.print()">Drucken / als PDF speichern</button><p>Erstellen Sie einen Screenshot, auf dem Ihr Name, die Punktezahl und die Note sichtbar sind, und geben Sie ihn in Google Classroom ab.</p></div></section><section class="panel"><h2>Ihre Fehleranalyse</h2><p>Die Punkteabzüge je Einzelfehler sind gerundet dargestellt. Die Stationsbewertung wird intern mit ungerundeten Werten berechnet.</p>${records.map(r=>`<h3>Station ${r.stage+1}: ${NAMES[r.stage]}</h3>${r.issues.length?r.issues.map(e=>`<div class="error"><b>${esc(e.label)}</b><p>Ihre Eingabe: ${esc(e.got)}<br>Richtig: ${esc(e.want)}<br>Punkteabzug: ${e.lost.toFixed(2)}</p></div>`).join(''):'<p class="good">Keine Fehler in den bewerteten Kriterien.</p>'}`).join('')}</section>`}
